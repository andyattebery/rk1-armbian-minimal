# Installed into /etc/cloud/cloud.cfg.d/ by customize-image.sh. Armbian's systemd-networkd DHCP on
# every Ethernet port (/etc/netplan/10-dhcp-all-interfaces.yaml) stays the only network config.
# cloud-init's network-config, which the cloud-init extension doesn't reconcile with it, is ignored.
network:
  config: disabled
