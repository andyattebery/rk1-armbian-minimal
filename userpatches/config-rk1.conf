# Armbian build config for the Turing RK1 vendor-kernel image (README.md), used by
# `./compile.sh build rk1 PREFER_DOCKER=no`, which scripts/build.sh runs.
# Armbian sources this file after it has decided whether to relaunch under Docker or sudo
# (lib/functions/cli/entrypoint.sh), so PREFER_DOCKER set here would come too late. It is
# passed on the command line instead.
BOARD=turing-rk1
BRANCH=vendor
RELEASE=trixie
BUILD_MINIMAL=yes
BUILD_DESKTOP=no
KERNEL_CONFIGURE=no

# apt-mark hold every Armbian deb (kernel, DTB, U-Boot, BSP). apt.armbian.com's stable kernel is
# 6.1.115 and would replace this one. They change only by bumping pins and rebuilding.
BSPFREEZE=yes

# The image ships as <name>.img.xz plus <name>.img.xz.sha (the compressed file's hash): GitHub release
# assets must be under 2 GiB, and the raw image is 2.4 GiB. xz deletes the raw .img. tpi flash and
# balenaEtcher take the .xz as it is.
COMPRESS_OUTPUTIMAGE="sha,xz"

# No DEFAULT_OVERLAYS: the GPU runs on the vendor kbase driver and libmali, which needs the
# panthor-gpu overlay off.

# The family file sets KERNELBRANCH inside `case $BRANCH`, so the pin goes in the per-branch hook
# that runs after it (lib/functions/configuration/main-config.sh). The commit must equal
# KERNEL_COMMIT in ../versions.env; scripts/build.sh refuses to build if they differ.
function post_family_config_branch_vendor__pin_kernel() {
    declare -g KERNELBRANCH='commit:44bbd021d7808cab93d1f2d64c1f092038257576'
}
