# Armbian build config for the Turing RK1 vendor-kernel image (README.md), used by
# `./compile.sh build rk1 RELEASE=<trixie|resolute> PREFER_DOCKER=no`, which scripts/build.sh runs.
# Armbian sources this file after it has decided whether to relaunch under Docker or sudo
# (lib/functions/cli/entrypoint.sh), so PREFER_DOCKER set here would come too late. It is
# passed on the command line instead.
BOARD=turing-rk1
BRANCH=vendor
# No RELEASE here: scripts/build.sh --release passes RELEASE=trixie or RELEASE=resolute on the
# command line, and Armbian applies command-line parameters after each config file
# (lib/functions/cli/entrypoint.sh).
BUILD_MINIMAL=yes
BUILD_DESKTOP=no
KERNEL_CONFIGURE=no

# apt-mark hold every Armbian deb (kernel, DTB, U-Boot, BSP). apt.armbian.com's stable kernel is
# 6.1.115 and would replace this one. They change only by bumping pins and rebuilding.
BSPFREEZE=yes

# First boot is cloud-init (NoCloud), from Armbian's cloud-init extension
# (extensions/cloud-init/cloud-init.sh). It makes /boot a FAT partition labelled armbi_boot (p1),
# which NoCloud reads user-data and meta-data from; it removes Armbian's first-login trigger; and it
# adds "-ci" to the image name after the kernel version (lib/functions/image/rootfs-to-image.sh:19).
enable_extension "cloud-init"
# cloud-init creates the SSH host keys on the first boot. armbian-firstrun would otherwise delete and
# regenerate them after ssh has started (packages/bsp/common/usr/lib/armbian/armbian-firstrun).
OPENSSHD_REGENERATE_HOST_KEYS=false

# The image ships as <name>.img.xz plus <name>.img.xz.sha (the compressed file's hash): GitHub release
# assets must be under 2 GiB, and the raw image is 2.4 GiB. xz deletes the raw .img. tpi flash and
# balenaEtcher take the .xz as it is.
COMPRESS_OUTPUTIMAGE="sha,xz"

# No DEFAULT_OVERLAYS: the GPU runs on the vendor kbase driver and libmali, which needs the
# panthor-gpu overlay off.

# The family file sets KERNELBRANCH inside `case $BRANCH`, so the pin goes in the per-branch hook
# that runs after it (lib/functions/configuration/main-config.sh). The commit must equal
# KERNEL_COMMIT in ../versions.env; scripts/build.sh refuses to build if they differ.
function post_family_config_branch_vendor__pin_kernel() {
    declare -g KERNELBRANCH='commit:44bbd021d7808cab93d1f2d64c1f092038257576'
}

# Writes the distro's own version, e.g. "Ubuntu 26.04 LTS (resolute)", to output/distro.txt, which
# scripts/build.sh copies out as <name>.img.xz.distro for the release notes. Armbian's base-files
# replaces /etc/os-release, a symlink to /usr/lib/os-release, with its own file and keeps no copy
# of the original (lib/functions/artifacts/artifact-armbian-base-files.sh), so /usr/lib/os-release
# is the distro's. The .img.txt Armbian writes has no distro version. Runs on the build host after
# customize-image.sh (lib/functions/rootfs/customize.sh).
function post_customize_image__record_distro() {
    local osr="${SDCARD}/usr/lib/os-release" line
    [[ -s "$osr" ]] || exit_with_error "No distro os-release in the image" "$osr"
    # Sourced in a subshell, so its variables stay out of the build's. Debian's os-release has no
    # point release; /etc/debian_version has it.
    line="$(
        # shellcheck source=/dev/null
        . "$osr"
        if [[ "${ID:-}" != debian ]]; then
            printf '%s (%s)\n' "${PRETTY_NAME:-}" "${VERSION_CODENAME:-}"
        elif [[ -s "${SDCARD}/etc/debian_version" ]]; then
            printf '%s %s (%s)\n' "${NAME:-}" "$(< "${SDCARD}/etc/debian_version")" "${VERSION_CODENAME:-}"
        else
            exit 1
        fi
    )" || exit_with_error "No /etc/debian_version in the Debian image" "${SDCARD}"
    # One printable line ending in the codename of the release being built.
    if [[ ! "$line" =~ ^[[:print:]]+\ \(([a-z]+)\)$ || "${BASH_REMATCH[1]}" != "$RELEASE" ]]; then
        exit_with_error "Unexpected distro line for ${RELEASE}" "$line"
    fi
    printf '%s\n' "$line" > "${DEST}/distro.txt"
}
