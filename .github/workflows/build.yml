# Builds the image and publishes it as a GitHub release (README.md). Runs when what the image is
# built from changes on main, or by hand from the Actions tab.
name: Build image

on:
  push:
    branches: [main]
    paths:
      - versions.env
      - userpatches/**
      - scripts/**
      - licenses/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # arm64 like the image, so Armbian builds the root filesystem natively rather than under qemu.
    runs-on: ubuntu-24.04-arm
    # GitHub's limit for a job on its runners.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      # The runner has 14 GB of SSD. A build that gets Armbian's cached kernel needs well under
      # that; one that has to compile the kernel needs more.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /

      - name: Build the image
        run: scripts/build.sh --work-dir "$RUNNER_TEMP/work" --out "$RUNNER_TEMP/out"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./versions.env
          images=("$RUNNER_TEMP"/out/*.img.xz)
          image="${images[0]}"
          name="$(basename "$image")"
          # Armbian-unofficial_<armbian version>_Turing-rk1_trixie_vendor_<kernel>_minimal.img.xz
          kernel="$(cut -d _ -f 6 <<< "$name")"
          [[ "$kernel" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "No kernel version in $name"; exit 1; }
          sha="$(cut -d ' ' -f 1 "$image.sha")"
          notes="Debian 13 (trixie) on Rockchip's vendor kernel $kernel for the Turing RK1, built with the Armbian build framework at $ARMBIAN_BUILD_SHA (kernel: armbian/linux-rockchip $KERNEL_COMMIT).

          First boot is Armbian's: log in over SSH as root with password 1234 (the serial console logs root in by itself). It asks for a new root password and creates a user.

          sha256 of the .img.xz: $sha
          Built from $GITHUB_SHA.

          Attached licences: Arm's EULA for the Mali GPU userspace (libmali), Rockchip's licence for the RKLLM runtime, and Rockchip's statement for the RKNN runtime and RKNN Toolkit Lite2."
          gh release create "$kernel-$GITHUB_RUN_NUMBER" --target "$GITHUB_SHA" \
            --title "Debian 13, vendor kernel $kernel (build $GITHUB_RUN_NUMBER)" --notes "$notes" \
            "$image" "$image.sha" licenses/*
