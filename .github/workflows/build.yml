# Builds the image for each release, Debian 13 (trixie) and Ubuntu 26.04 (resolute), and publishes
# both as one GitHub release, only when both built (README.md). Runs when what the images are built
# from changes on main, or by hand from the Actions tab.
name: Build images

on:
  push:
    branches: [main]
    paths:
      - versions.env
      - userpatches/**
      - scripts/**
      - licenses/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # arm64 like the image, so Armbian builds the root filesystem natively rather than under qemu.
    runs-on: ubuntu-24.04-arm
    # GitHub's limit for a job on its runners.
    timeout-minutes: 360
    strategy:
      # One release failing doesn't cancel the other, so each run shows both results.
      fail-fast: false
      matrix:
        release: [trixie, resolute]
    env:
      RELEASE: ${{ matrix.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: scripts/build.sh --release "$RELEASE" --work-dir "$RUNNER_TEMP/work" --out "$RUNNER_TEMP/out"

      # The .img.xz, .sha and .distro, for the publish job. The image is already xz-compressed.
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.release }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    # Runs only when every release built.
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./versions.env
          shopt -s nullglob
          # Armbian-unofficial_<armbian version>_Turing-rk1_<release>_vendor_<kernel>-ci_minimal.img.xz
          armbian_version="" kernel="" notes="" assets=()
          for release in trixie resolute; do
            images=("$RUNNER_TEMP"/out/*_"$release"_vendor_*.img.xz)
            if [[ ${#images[@]} -ne 1 || ! -s "${images[0]}.sha" || ! -s "${images[0]}.distro" ]]; then
              echo "Expected one $release .img.xz with its .sha and .distro, found: ${images[*]}"
              exit 1
            fi
            image="${images[0]}"
            name="$(basename "$image")"
            v="$(cut -d _ -f 2 <<< "$name")"
            # Armbian's cloud-init extension appends -ci to the kernel field (rootfs-to-image.sh:19).
            k="$(cut -d _ -f 6 <<< "$name")"; k="${k%-ci}"
            if [[ -z "$armbian_version" ]]; then
              armbian_version="$v" kernel="$k"
            elif [[ "$v" != "$armbian_version" || "$k" != "$kernel" ]]; then
              echo "$name has a different Armbian or kernel version from the other image"
              exit 1
            fi
            printf -v paragraph '**%s**\n`%s`\nsha256 `%s`\n\n' \
              "$(cat "$image.distro")" "$name" "$(cut -d ' ' -f 1 "$image.sha")"
            notes+="$paragraph"
            assets+=("$image" "$image.sha")
          done
          [[ "$armbian_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "No Armbian version in $name"; exit 1; }
          [[ "$kernel" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "No kernel version in $name"; exit 1; }
          notes+="Both run Rockchip's vendor kernel $kernel for the Turing RK1 (armbian/linux-rockchip $KERNEL_COMMIT), built with the Armbian build framework at $ARMBIAN_BUILD_SHA.

          First boot is cloud-init (NoCloud). A user-data and meta-data written into the FAT armbi_boot partition before flashing set up the node. Without them, log in as root with password 1234 over SSH (the serial console logs root in by itself) and change it; nothing forces the change. Armbian's usual first-login setup (root password, user, shell, locale, time zone) runs with: touch /root/.not_logged_in_yet && bash /usr/lib/armbian/armbian-firstlogin. Networking is Armbian's DHCP on every Ethernet port.

          Built from $GITHUB_SHA.

          Attached licences: Arm's EULA for the Mali GPU userspace (libmali), Rockchip's licence for the RKLLM runtime, and Rockchip's statement for the RKNN runtime and RKNN Toolkit Lite2."
          gh release create "$kernel-$GITHUB_RUN_NUMBER" --target "$GITHUB_SHA" \
            --title "Armbian $armbian_version, kernel $kernel (build $GITHUB_RUN_NUMBER)" --notes "$notes" \
            "${assets[@]}" licenses/*
